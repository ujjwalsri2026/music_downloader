name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Stage static assets
        # upload-pages-artifact takes a SINGLE directory path - it does not
        # support multi-line path lists (that is an actions/upload-artifact
        # feature). Stage the publishable files into their own directory so we
        # can include only the static app and never the Python daemon source,
        # downloads/, or anything else in the repo.
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R css js assets _site/
          cp .nojekyll _site/
          echo "Staged:" && ls -A _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
